# Tag-driven cross-repo release: build on a Windows runner, publish the artifacts to the
# dedicated installer repo's Releases (binaries never live in either git tree).
#
# Requires a one-time RELEASE_PAT secret on THIS repo — a fine-grained PAT with
# "Contents: Read and write" on MrParkerZ7/installer-video-spliter-joiner:
#     gh secret set RELEASE_PAT -R MrParkerZ7/project-video-spliter-joiner
# Until it is set, the build still runs and the publish step is skipped (never a hard red).
#
# The local counterpart is `release-local`, which builds + publishes from a dev machine
# using `gh` auth and needs no PAT at all. v1.0.0 was cut that way.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.1)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace '^refs/tags/v','' }
               else { '${{ github.event.inputs.version }}' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test (release gate)
        run: dotnet test VideoSplitJoiner.sln -c Debug --nologo

      - name: Fetch bundled ffmpeg shared build
        shell: pwsh
        run: ./packaging/fetch-ffmpeg-shared.ps1

      - name: Package (self-contained exe + ffmpeg + portable zip)
        shell: pwsh
        run: ./packaging/package.ps1 -Dotnet 'dotnet'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\VideoSplitJoiner.iss

      - name: Checksums
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Get-ChildItem dist\*.exe, dist\*.zip |
            Where-Object { $_.Name -like "*$v*" } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist\SHA256SUMS.txt -Encoding utf8
          Get-Content dist\SHA256SUMS.txt

      - name: Publish Release to the installer repo
        if: env.RELEASE_PAT != ''
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        uses: softprops/action-gh-release@v2
        with:
          repository: MrParkerZ7/installer-video-spliter-joiner
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/VideoSplitJoiner-v${{ steps.ver.outputs.version }}-setup.exe
            dist/VideoSplitJoiner-v${{ steps.ver.outputs.version }}-win-x64.zip
            dist/SHA256SUMS.txt

      - name: Note when RELEASE_PAT is unset
        if: env.RELEASE_PAT == ''
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: echo "::warning::RELEASE_PAT is not set - artifacts were built but not published. See the installer repo README."
